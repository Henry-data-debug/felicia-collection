<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" width="380" height="72" fill="none">
  <!-- Monogram Crest -->
  <g transform="translate(8, 4)">
    <defs>
      <linearGradient id="goldGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F2D06B"/>
        <stop offset="50%" stop-color="#D4AF37"/>
        <stop offset="100%" stop-color="#E5C158"/>
      </linearGradient>
    </defs>
    <!-- Outer ring -->
    <circle cx="32" cy="32" r="30" stroke="url(#goldGradWhite)" stroke-width="1.5" fill="none"/>
    <!-- Inner dashed accent ring -->
    <circle cx="32" cy="32" r="26.5" stroke="url(#goldGradWhite)" stroke-width="0.8" stroke-dasharray="2.5,2" fill="none" opacity="0.7"/>
    <!-- 4 diamond studs -->
    <polygon points="32,4 34,6 32,8 30,6" fill="url(#goldGradWhite)"/>
    <polygon points="32,56 34,58 32,60 30,58" fill="url(#goldGradWhite)"/>
    <polygon points="4,32 6,34 8,32 6,30" fill="url(#goldGradWhite)"/>
    <polygon points="56,32 58,34 60,32 58,30" fill="url(#goldGradWhite)"/>
    <!-- Intertwined FC Monogram -->
    <text x="26" y="41" font-family="'Playfair Display', 'Didot', 'Bodoni MT', Georgia, serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">F</text>
    <text x="39" y="41" font-family="'Playfair Display', 'Didot', 'Bodoni MT', Georgia, serif" font-size="26" font-weight="600" fill="url(#goldGradWhite)" text-anchor="middle" letter-spacing="-1">C</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(88, 30)">
    <text x="0" y="2" font-family="'Playfair Display', 'Didot', 'Bodoni MT', 'Times New Roman', serif" font-size="25" font-weight="700" fill="#FFFFFF" letter-spacing="6">FELICIA</text>
    <text x="0" y="22" font-family="'Montserrat', 'Century Gothic', -apple-system, sans-serif" font-size="9" font-weight="600" fill="url(#goldGradWhite)" letter-spacing="6">COLLECTIONS</text>
    <!-- Nairobi subline with hairline dividers -->
    <line x1="140" y1="19" x2="165" y2="19" stroke="url(#goldGradWhite)" stroke-width="0.8" opacity="0.7"/>
    <text x="195" y="22" font-family="'Montserrat', 'Century Gothic', -apple-system, sans-serif" font-size="7.5" font-weight="500" fill="#CCCCCC" letter-spacing="3" text-anchor="middle">NAIROBI</text>
    <line x1="225" y1="19" x2="250" y2="19" stroke="url(#goldGradWhite)" stroke-width="0.8" opacity="0.7"/>
  </g>
</svg>